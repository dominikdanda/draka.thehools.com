name: Deploy Draka

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: draka-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DRAKA_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.DRAKA_SSH_HOST }}
          SSH_HOST_KEY: ${{ secrets.DRAKA_SSH_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy
        env:
          SSH_HOST: ${{ secrets.DRAKA_SSH_HOST }}
        run: |
          ssh -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -i ~/.ssh/id_ed25519 \
            draka-deploy@"$SSH_HOST" deploy
